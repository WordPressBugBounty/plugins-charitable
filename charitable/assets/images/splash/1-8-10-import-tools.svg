<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 600" fill="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
	<!-- Background -->
	<rect width="830" height="600" fill="#f3f4f6"/>

	<!-- Source services row at top -->
	<g transform="translate(120,40)">
		<!-- GiveWP card -->
		<rect width="160" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
		<rect x="14" y="16" width="42" height="42" rx="8" fill="#fb923c"/>
		<path d="M28,30 q0,-4 7,-4 q7,0 7,5 q0,5 -7,5 v6" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
		<circle cx="35" cy="48" r="2.2" fill="#ffffff"/>
		<text x="68" y="38" fill="#1d2327" font-size="13" font-weight="700">GiveWP</text>
		<text x="68" y="55" fill="#6b7280" font-size="11">245 donations</text>

		<!-- GiveButter card -->
		<g transform="translate(180,0)">
			<rect width="160" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
			<rect x="14" y="16" width="42" height="42" rx="8" fill="#facc15"/>
			<path d="M22,40 q0,-10 13,-10 q13,0 13,10" stroke="#1d2327" stroke-width="3" stroke-linecap="round" fill="none"/>
			<circle cx="29" cy="36" r="2" fill="#1d2327"/>
			<circle cx="41" cy="36" r="2" fill="#1d2327"/>
			<text x="68" y="38" fill="#1d2327" font-size="13" font-weight="700">GiveButter</text>
			<text x="68" y="55" fill="#6b7280" font-size="11">112 donations</text>
		</g>

		<!-- CSV card -->
		<g transform="translate(360,0)">
			<rect width="160" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
			<g transform="translate(14,16)">
				<path d="M0,4 q0,-4 4,-4 h26 l12,12 v30 q0,4 -4,4 h-34 q-4,0 -4,-4 z" fill="#10b981"/>
				<path d="M30,0 v8 q0,4 4,4 h8" stroke="#ffffff" stroke-width="1.5" fill="none"/>
				<text x="21" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">CSV</text>
			</g>
			<text x="68" y="38" fill="#1d2327" font-size="13" font-weight="700">CSV File</text>
			<text x="68" y="55" fill="#6b7280" font-size="11">Donations.csv</text>
		</g>
	</g>

	<!-- Dashed orange arrows pointing down from sources -->
	<g stroke="#e27730" stroke-width="2" stroke-dasharray="4,4" fill="none">
		<path d="M200,128 v18"/>
		<path d="M380,128 v18"/>
		<path d="M560,128 v18"/>
	</g>
	<g fill="#e27730">
		<polygon points="194,144 200,154 206,144"/>
		<polygon points="374,144 380,154 386,144"/>
		<polygon points="554,144 560,154 566,144"/>
	</g>

	<!-- Tools panel card -->
	<rect x="92" y="172" width="646" height="402" rx="14" fill="#000" opacity="0.06"/>
	<rect x="90" y="170" width="650" height="402" rx="14" fill="#ffffff"/>

	<!-- Header bar -->
	<path d="M90,184 Q90,170 104,170 H726 Q740,170 740,184 V232 H90 Z" fill="#1d2327"/>
	<text x="120" y="208" fill="#ffffff" font-size="17" font-weight="600">Tools</text>
	<text x="180" y="208" fill="#9ca3af" font-size="14">/  Import</text>

	<!-- Tab bar -->
	<rect x="90" y="232" width="650" height="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="0"/>
	<line x1="90" y1="282" x2="740" y2="282" stroke="#e5e7eb"/>

	<!-- Charitable tab -->
	<text x="124" y="262" fill="#6b7280" font-size="13" font-weight="500">Charitable</text>

	<!-- GiveWP tab (active) -->
	<text x="220" y="262" fill="#1d2327" font-size="13" font-weight="700">GiveWP</text>
	<rect x="216" y="277" width="58" height="3" rx="1.5" fill="#e27730"/>
	<rect x="276" y="251" width="38" height="18" rx="9" fill="#fef3c7"/>
	<text x="295" y="263" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">BETA</text>

	<!-- GiveButter tab -->
	<text x="328" y="262" fill="#6b7280" font-size="13" font-weight="500">GiveButter</text>

	<!-- CSV tab -->
	<text x="424" y="262" fill="#6b7280" font-size="13" font-weight="500">CSV Import</text>

	<!-- Tab content (active = GiveWP migration) -->
	<text x="124" y="320" fill="#1d2327" font-size="16" font-weight="700">GiveWP Migration Tool</text>
	<text x="124" y="344" fill="#6b7280" font-size="12">Detected GiveWP installation. Import donations, donors, and campaigns to Charitable.</text>

	<!-- Detected stats grid -->
	<g transform="translate(120,366)">
		<!-- Donations stat -->
		<rect width="190" height="78" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
		<text x="16" y="28" fill="#9a3412" font-size="11" font-weight="700" letter-spacing="0.5">DONATIONS</text>
		<text x="16" y="58" fill="#1d2327" font-size="26" font-weight="800">245</text>

		<!-- Donors stat -->
		<g transform="translate(206,0)">
			<rect width="190" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
			<text x="16" y="28" fill="#1e40af" font-size="11" font-weight="700" letter-spacing="0.5">DONORS</text>
			<text x="16" y="58" fill="#1d2327" font-size="26" font-weight="800">182</text>
		</g>

		<!-- Campaigns stat -->
		<g transform="translate(412,0)">
			<rect width="190" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
			<text x="16" y="28" fill="#166534" font-size="11" font-weight="700" letter-spacing="0.5">CAMPAIGNS</text>
			<text x="16" y="58" fill="#1d2327" font-size="26" font-weight="800">12</text>
		</g>
	</g>

	<!-- Progress bar -->
	<text x="124" y="476" fill="#1d2327" font-size="12" font-weight="600">Migration progress</text>
	<text x="710" y="476" text-anchor="end" fill="#e27730" font-size="12" font-weight="700">65%</text>

	<rect x="120" y="486" width="590" height="10" rx="5" fill="#e5e7eb"/>
	<rect x="120" y="486" width="384" height="10" rx="5" fill="#e27730"/>

	<text x="124" y="514" fill="#6b7280" font-size="11">Importing donations &#8230; 159 of 245 complete</text>

	<!-- Action buttons -->
	<rect x="120" y="528" width="180" height="44" rx="6" fill="#e27730"/>
	<text x="210" y="555" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Continue Migration</text>

	<rect x="312" y="528" width="120" height="44" rx="6" fill="#ffffff" stroke="#d1d5db"/>
	<text x="372" y="555" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">Pause</text>
</svg>
